name: CI

# The build we gate on is the one CLAUDE.md mandates:
#   "Verify correct output for ai-tools-engine project with running `./gradlew clean build`,
#    focus on running ktlint and detekt"
# `build` -> `check` -> `ktlintCheck` + `detekt` + `jacocoTestReport` are wired up by
# KotlinJvmConventionPlugin, so a single `clean build` enforces all of them.
on:
  # Every branch, not just main: feature branches must be verified before review.
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-engine:
    name: Build and Verify Engine
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        # The Gradle wrapper lives in ai-tools-engine/, not at the repository root.
        working-directory: ai-tools-engine
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: 'gradle'

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: ai-tools-engine

      - name: Build, test, ktlint and detekt
        run: ./gradlew clean build --stacktrace

      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine-reports
          # Artifact paths are resolved from the workspace root, not the working-directory above.
          path: |
            ai-tools-engine/**/build/reports/
            ai-tools-engine/**/build/test-results/
          retention-days: 7
          if-no-files-found: ignore
