id: run-ktlint
description: Run ktlint for Kotlin code formatting
triggers:
  - 'User asks to run ktlint'
  - 'User asks for Kotlin formatting check'
sections:
  - text: |
      Run `./gradlew ktlintCheck` in the project directory.
      After running ktlint, list formatting violations grouped by file.
      Suggest running `./gradlew ktlintFormat` to auto-fix issues.
metadata:
  version: 1.0.0
  author: 'AI Tools Team'
  created: '2025-01-01'
  tags:
    - ktlint
    - kotlin
    - formatting
