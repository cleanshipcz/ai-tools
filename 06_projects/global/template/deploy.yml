# Deployment Configuration for this Project
# This file should be committed to version control
# Create deploy.local.yml for local overrides (gitignored)

# Target project directory (can be relative or absolute)
# Override in deploy.local.yml with your local path
target: './.output/'

# Tools to deploy
tools:
  - github-copilot
  - windsurf
  # - cursor
  # - claude-code

# Deployment mode: local or manual
# local: Automatically deploy to the target directory
# manual: Generate configs and show manual copy instructions
mode: local

# Backup existing files before deploying
backup: true

# Auto-commit changes to git (requires mode: local and git repository)
auto_commit: false
# Git branch to use for auto-commit (optional)
# git_branch: "chore/update-ai-config"

# ================================
# Deployment Filters & Tech Stack
# ================================
tech_stack:
  # Programming languages used
  languages:
    - typescript
    # - python
    # - java
    # - kotlin

  # Frontend frameworks and libraries
  frontend:
    - react
    # - vue
    # - angular
    # - svelte

  # Backend frameworks and libraries
  backend:
    - node.js
    # - express
    # - django
    # - spring-boot

  # Database systems
  database:
    # - postgresql
    # - mongodb
    # - mysql

  # Infrastructure and deployment tools
  infrastructure:
    # - docker
    # - kubernetes
    # - aws
    # - terraform

  # Development tools and utilities
  tools:
    # - jest
    # - eslint
    # - prettier

ai_tools:
  # Preferred defaults for this deployment
  # Available: claude-sonnet-4.5, claude-sonnet-4, claude-haiku-4.5, gpt-5, gpt-5.1, gpt-5.1-codex-mini, gpt-5.1-codex
  model: claude-sonnet-4.5

agents:
  include:
    - '^feature-builder$'
    # - '^code-reviewer$'
  # exclude:
  #   - 'experimental-agent'

prompts:
  include:
    - '^refactor/extract-method$'
    # - '^qa/write-tests$'
  # exclude:
  #   - 'prompts/legacy/'

rulesets:
  include:
    - '^base$'
    - '^coding-typescript$'
  # exclude:
  #   - 'coding-java'

recipes:
  include:
    - '^feature-delivery$'
  # exclude:
  #   - 'experimental'
