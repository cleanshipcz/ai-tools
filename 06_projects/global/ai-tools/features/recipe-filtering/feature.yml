id: recipe-filtering
version: 1.0.0
name: Recipe Filtering for Projects
description: Enable projects to filter recipes with regex allow/deny patterns, controlling which multi-agent workflows are available for deployment

context:
  overview: |
    Add the ability for projects to control which recipes are available using regex-based
    allow/deny patterns. This extends the existing filtering system (agents, prompts,
    rulepacks) to include recipes, allowing fine-grained control over which automated
    workflows can be deployed to specific projects.

    This feature is useful for:
    - Restricting complex workflows to mature projects only
    - Preventing accidental deployment of experimental recipes
    - Customizing workflow availability per project type
    - Enforcing project-specific workflow policies

  architecture: |
    The implementation follows the existing regex filtering pattern used for agents, prompts,
    and rulepacks:

    1. **Schema Extension**: Add recipe_allow_patterns and recipe_deny_patterns arrays to
       deploy.schema.json and remove legacy whitelist/blacklist fields.
       - Arrays of regex strings used to include/exclude recipes
       - Validation should reject unknown whitelist/blacklist keys

    2. **Type Definitions**: Update AIToolsConfig interface in the generator
       - Add recipe_allow_patterns?: string[]
       - Add recipe_deny_patterns?: string[]

    3. **Filtering Logic**: Implement shouldIncludeRecipe() method
       - Allow patterns gate inclusion
       - Deny patterns run after allow checks
       - Default to including all recipes if no filters defined

    4. **Generator Integration**: Apply filtering in recipe generation methods
       - Filter recipes before deployment/generation
       - Respect project-level filtering during deploy operations

  dependencies:
    - Existing project system (06_projects/)
    - Recipe system (05_recipes/)
    - Project schema validation (10_schemas/project.schema.json)
    - Project generator script (11_scripts/gen-project.ts)
    - Deploy script (11_scripts/deploy-project.ts)

files:
  patterns:
    - 10_schemas/project.schema.json
    - 11_scripts/gen-project.ts
    - 11_scripts/deploy-project.ts
    - 06_projects/global/ai-tools/project.yml
    - 06_projects/README.md
    - 05_recipes/README.md
    - 10_schemas/**
    - 11_scripts/**
    - 06_projects/**

conventions:
  - 'Follow the existing filtering pattern for agents, prompts, and rulepacks'
  - 'Use recipe_allow_patterns and recipe_deny_patterns (regex strings)'
  - 'Reject legacy whitelist/blacklist fields in schemas'
  - 'Implement shouldIncludeRecipe() method similar to shouldIncludeAgent()'
  - 'Apply filtering in both generation and deployment phases'
  - 'Update schema validation to prevent whitelist/blacklist usage'
  - 'Document the feature in projects/README.md and 05_recipes/README.md'
  - 'Preserve backwards compatibility - no filtering if patterns omitted'

recipe:
  id: feature-delivery
  context:
    feature_description: |
      Implement recipe filtering for projects with the following components:

      1. **Schema Extension** (10_schemas/deploy.schema.json):
         - Add recipe_allow_patterns and recipe_deny_patterns arrays to ai_tools
         - Remove legacy whitelist_recipes/blacklist_recipes fields
         - Enforce rejection of unknown whitelist/blacklist keys

      2. **Type Definitions** (generator utilities):
         - Add recipe_allow_patterns?: string[] to AIToolsConfig interface
         - Add recipe_deny_patterns?: string[] to AIToolsConfig interface

      3. **Filtering Logic**:
         - Implement shouldIncludeRecipe(recipeId: string): boolean using allow/deny regex patterns
         - Default to true when no recipe patterns are configured

      4. **Generator Integration**:
         - Apply shouldIncludeRecipe() filter when loading/processing recipes
         - Ensure filtering runs before recipe deployment or script generation

      5. **Deploy Script Integration**:
         - Ensure filtering is respected during deployment
         - Only deploy recipes that pass shouldIncludeRecipe() check

      6. **Documentation Updates**:
         - Update 06_projects/README.md with regex recipe filtering examples
         - Update 05_recipes/README.md mentioning project-level filtering

      7. **Testing**:
         - Add tests ensuring whitelist/blacklist keys fail schema validation
         - Test generation and deployment with regex-based filtered recipes

    acceptance_criteria: |
      Schema Changes:
      - [ ] recipe_allow_patterns and recipe_deny_patterns added to deploy schema as regex string arrays
      - [ ] Legacy whitelist_recipes/blacklist_recipes keys are rejected by validation

      Type Definitions:
      - [ ] recipe_allow_patterns?: string[] added to AIToolsConfig interface
      - [ ] recipe_deny_patterns?: string[] added to AIToolsConfig interface
      - [ ] TypeScript compiles without errors

      Filtering Implementation:
      - [ ] shouldIncludeRecipe() method implemented in ProjectGenerator class using allow/deny regex patterns
      - [ ] Default behavior: returns true if no filtering configured
      - [ ] Method signature matches existing should* methods

      Integration:
      - [ ] Recipe loading/generation respects shouldIncludeRecipe() filter
      - [ ] Deployment respects shouldIncludeRecipe() filter
      - [ ] Filtered recipes do not appear in generated adapter directories
      - [ ] Filtered recipes do not get deployed to target projects

      Testing:
      - [ ] Validation fails when whitelist/blacklist recipe keys are provided
      - [ ] Generated adapters only contain recipes allowed by regex filters
      - [ ] Deployed projects only contain allowed recipes
      - [ ] No regression in existing agent/prompt/rulepack filtering

      Documentation:
      - [ ] 06_projects/README.md updated with recipe filtering section
      - [ ] 05_recipes/README.md mentions project-level filtering capability
      - [ ] Clear explanation of regex allow/deny behavior

  tools:
    - copilot-cli
    - claude-code

