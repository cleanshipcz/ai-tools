id: tech-stack-project
version: 1.0.0
name: 'Tech-Stack Project Filtering'
description: 'Filter rulesets by project tech-stack to reduce noise - TypeScript projects see only TypeScript rules, not Python or Kotlin'

context:
  overview: |
    Currently all agents contain all rulesets. A TypeScript project gets Python, Kotlin, Java rules mixed in.
    This clogs the context window unnecessarily.

    Solution: Projects declare their tech-stack in deploy.yml (typescript, python, kotlin, etc).
    When generating agents/prompts for that project, include only rulesets tagged for those technologies.

    Example:
    - Project with deploy.yml tech_stack: [typescript] → feature-builder only includes coding-typescript rules
    - Project with deploy.yml tech_stack: [typescript, python] → feature-builder includes coding-typescript and coding-python
    - Project with deploy.yml tech_stack: [kotlin] → feature-builder only includes coding-kotlin rules

files:
  patterns:
    - '10_schemas/ruleset.schema.json'
    - '10_schemas/project.schema.json'
    - '11_scripts/gen-project.ts'
    - '01_rulesets/*.yml'

conventions:
  - 'Each ruleset must declare which tech-stacks it applies to via tags field'
  - 'Projects declare their tech-stack in deploy.yml as array of language/tech names'
  - 'When generating adapters, filter rulesets by matching tech-stack'
  - 'Backward compatible: projects without tech_stack declaration get all rulesets'

recipe:
  id: feature-delivery
  context:
    feature_description: |
      Filter generated agents/prompts to only include rulesets matching the project tech-stack.

      Current: feature-builder for any project includes coding-python, coding-typescript, coding-kotlin, coding-java
      Desired: feature-builder for typescript project only includes coding-typescript

      Changes needed:
      1. Ruleset schema: Add tech_stacks array field listing which languages/techs this ruleset applies to
      2. Deploy schema: Confirm tech_stack field exists for declaring project technologies
      3. gen-project.ts: Modify shouldIncludeRuleset() to filter by tech-stack match
      4. Update all rulesets with appropriate tech_stacks tags
      5. Update ai-tools deploy.yml tech_stack field

    acceptance_criteria: |
      - Ruleset schema supports tech_stacks array field
      - gen-project.ts filters rulesets when project has tech_stack declared
      - All rulesets tagged with tech_stacks (python, typescript, kotlin, java, etc)
      - Generated agents contain only matching rulesets
      - Backward compatible: projects without tech_stack still work
      - All tests pass

metadata:
  status: draft
  owner: ai-tools-core
  created: 2025-11-16
  tags:
    - filtering
    - rulesets
    - tech-stack
