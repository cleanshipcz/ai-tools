id: ai-tools-project
description: A unified mono-repository for AI agent configuration - define once in YAML, deploy everywhere
context:
  overview: |
    A comprehensive solution for managing AI agent prompts, rules, skills, and tool configurations.
    Keep your "source of truth" in small, typed YAML manifests and automatically generate
    tool-specific artifacts for Windsurf, Claude Code, Cursor, GitHub Copilot, and other AI coding assistants.

    The repository provides a build system that transforms unified YAML manifests into
    tool-specific formats, ensuring consistency across different AI coding environments.
    It includes prompts for common tasks, agents for specific roles, rulesets for coding standards,
    skills for tool integrations, and a project system for per-project configurations.
  documentation:
    readme: README.md
    per_topic:
      main_docs:
        prompts: 03_prompts/README.md
        agents: AGENTS.md
        skills: 04_skills/README.md
        deployments: 09_deployments/README.md
        recipes: 08_recipes/README.md
        tools: 90_docs/TOOLS.md
        user_tools: 90_docs/USER_TOOLS.md
        testing: 90_docs/TESTING.md
      development:
        style_guide: 90_docs/STYLE_GUIDE.md
        changelog: 90_docs/CHANGELOG.md
        planned_features: 90_docs/PLANNED_FEATURES.md
        implementation: IMPLEMENTATION.md
  rules:
    - Verify correct output for ai-tools-engine project with running `./gradlew clean build`, focus on running ktlint and detekt
deploy:
  # This project deploys onto the ai-tools repository itself.
  # Relative paths are resolved against `--working-dir`, which `deploy.sh` sets to
  # the repository root, so `.` is that root regardless of how the engine is launched.
  # Use an absolute path for any project outside this repository.
  directory: "."
  agents:
    filter:
      - type: tags
        tags:
          - common
          - ai
          - development
          - documentation
  prompts:
    filter:
      - type: whitelist
        ids:
          - refactor-extract-method
          - refactor-simplify-conditionals
          - refactor-remove-duplication
          - refactor-improve-naming
          - refactor-add-error-handling
          - docs-document-api
          - docs-write-readme
          - docs-create-tutorial
          - docs-summarize-pr
          - planning-design-architecture
          - planning-create-implementation-plan
          - planning-tech-decision-record
          - qa-write-tests
          - qa-setup-test-infrastructure
          - manifests-create-prompt
          - manifests-create-agent
          - manifests-create-project
          - manifests-create-feature
          - manifests-create-ruleset
          - manifests-create-skill
          - manifests-create-recipe
          - manifests-create-fragment
          - manifests-create-user-deployment
          - manifests-duplicate-project
  skills:
    filter:
      - type: tags
        tags:
          - kotlin
          - search
  rulesets:
    filter:
      - type: tags
        tags:
          - common
          - development
          - kotlin
          - unit
          - integration
          - documentation
          - testing
          - manifests
          - ai
