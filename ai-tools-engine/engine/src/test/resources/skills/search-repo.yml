id: search-repo
description: Search repository for code patterns or text
mcp_tool: 'filesystem:search'
inputs:
  - name: pattern
    type: string
    required: true
    description: 'Search pattern (regex or plain text)'
  - name: path
    type: directory
    required: false
    description: 'Directory to search in (defaults to repo root)'
triggers:
  - 'User asks to search the codebase'
prerequisites:
  - 'Use ripgrep or similar fast search tool if available.'
timeout_sec: 60
metadata:
  version: 1.0.0
  author: 'AI Tools Team'
  created: '2025-01-01'
  tags:
    - search
    - filesystem
