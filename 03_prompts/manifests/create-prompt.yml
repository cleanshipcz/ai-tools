id: manifests-create-prompt
description: Clarify prompt requirements and create a prompt.yml manifest aligned with the Kotlin engine
variables:
  - name: user_description
    required: true
    description: "Brief description of what the prompt should do"
rulesets:
  - authoring-yaml
  - authoring-ai
  - authoring-manifests
fragments:
  - authoring-engine-models
rules:
  - "Ask clarifying questions BEFORE generating the manifest"
  - "Keep prompts atomic - one clear purpose only"
  - "Variable names must be snake_case"
  - "Use Mustache syntax for variables: {{variable}}"
  - "Keep the prompt content concise and actionable"
content: |
  The user wants to create a prompt based on this description:

  {{user_description}}

  **Your job is to clarify and translate into a valid prompt manifest.**

  ## Step 1: Ask clarifying questions

  - What is the single, specific task this prompt performs?
  - What inputs does it need? (these become variables)
  - Are the inputs required or optional?
  - What should the output look like? (markdown, code, json, yaml, text)
  - What category? (check `03_prompts/` for the current set: docs, manifests, planning, qa, refactor, tickets, ...)
  - Any specific constraints or rules it should follow?

  ## Step 2: Suggest structure

  - Propose a kebab-case ID following the category-action pattern
  - Identify 2-3 key variables with snake_case names
  - Recommend the category directory for file placement

  ## Step 3: Create the prompt manifest

  Read PromptManifest.kt and derive the exact field set from it (see the engine-models instructions).
  Study one or two recently updated prompts in `03_prompts/` as style references before writing.

  How to fill the fields:

  - **content** is the actual prompt template. Use Mustache syntax: {{variable}} for interpolation, {{#optional}}...{{/optional}} for conditionals.
  - **variables** define the contract — what the caller must provide.
  - **rulesets** compose shared rules. Use for domain standards (authoring-manifests, coding-security, etc.).
  - **fragments** compose shared content blocks from `02_fragments/`. Use for reference material several prompts need.
  - **rules** are inline, prompt-specific constraints. Use sparingly; prefer rulesets.
  - **outputs** optionally declares the output format and examples.

  ## Best practices

  - **ONE clear purpose per prompt.** If it does two things, make two prompts.
  - Never duplicate content that exists as a ruleset or fragment — reference it instead.
  - File location: `03_prompts/<category>/<id>.yml`

  ## Example conversation

  User: "Extract a method from selected code"

  You: "Questions:
  - What input do we need? (the code block, the language?)
  - Should it auto-name the method or let user specify?
  - Any rules? (preserve behavior, add docstring, etc.)"

  User: "Code block and language as input, user specifies method name, preserve behavior exactly"

  You: "I'll create `refactor-extract-method` with:
  - Variables: code_block (required), language (required), method_name (required)
  - Rules: Preserve behavior exactly, extract to pure function
  - Output format: code
  - Category: refactor/
  Sound good?"

  After confirmation, remind the user to validate as described in the engine-models instructions (./deploy.sh --dry-run from the repository root).
outputs:
  format: yaml
metadata:
  version: 3.1.1
  author: "AI Tools Team"
  created: "2025-11-16"
  updated: "2026-09-04"
  tags:
