id: manifests-create-feature
description: Capture and clarify feature requirements, then create a feature.yml manifest aligned with the Kotlin engine
variables:
  - name: user_description
    required: true
    description: "Brief user description of what the feature should do"
  - name: project_id
    required: false
    description: "Project ID where the feature belongs (e.g., ai-tools)"
rulesets:
  - authoring-yaml
  - authoring-ai
  - authoring-manifests
rules:
  - "Ask clarifying questions BEFORE generating the manifest"
  - "Recommend concise descriptions, but allow detail when needed"
  - "Focus on capturing requirements and acceptance criteria"
  - "Use conversational tone to understand user intent"
  - "The Kotlin engine (FeatureManifest.kt) is the source of truth for feature.yml structure"
content: |
  The user wants to create a new feature based on this description:

  {{user_description}}

  **Your job is to clarify and translate into a valid feature manifest.**

  ## Step 1: Ask clarifying questions

  - What is the main goal or purpose of this feature?
  - Are there any specific constraints or dependencies?
  - What does success look like? (acceptance criteria)
  - What architectural context is relevant? (files, layers, patterns)
  - Any hard constraints on implementation? (must use X, never do Y)

  ## Step 2: Suggest structure

  - Propose a kebab-case ID (e.g., automated-testing, export-global-file)
  - Draft a brief description (1-2 sentences)
  - Identify key acceptance criteria

  ## Step 3: Create feature.yml matching FeatureManifest.kt

  The Kotlin engine requires this structure:

  ```yaml
  id: feature-name
  description: What this feature does (10-500 chars)

  context:                          # Optional
    overview: |
      What the feature is about and why it matters.
    architecture: |
      Relevant architectural details, layers, patterns.
    dependencies:                   # Optional
      - "library or feature this depends on"
    files:                          # Optional
      - "src/main/kotlin/path/to/relevant/code"

  prompt: |
    Implementation instructions for the agent working on this feature.
    This is the WHAT and HOW — specific enough to guide implementation.

    - The feature should do X
    - It should integrate with Y
    - Use pattern Z for consistency

  acceptance_criteria:              # Optional
    - "Specific, verifiable criterion"
    - "All existing tests pass"
    - "New feature is fully covered with tests"

  constraints:                      # Optional
    - "Use JUnit 5 + AssertJ for tests"
    - "Follow existing code patterns"

  metadata:
    version: 1.0.0
    author: "AI Tools Team"
    created: "YYYY-MM-DD"
    tags: [feature-domain]
  ```

  **Fields NOT supported by Kotlin engine:**
  name, version (top-level), files (top-level object), conventions, model, recipe, status, owner

  ## Key distinction

  - **description** = WHAT the feature is (brief, for humans reading a list)
  - **prompt** = HOW to implement it (detailed, for the agent doing the work)
  - **acceptance_criteria** = DONE WHEN (verifiable conditions)
  - **constraints** = BOUNDARIES (must/must-not rules)

  ## Example conversation

  User: "I need automated testing"

  You: "Let me clarify:
  - What should be tested? (unit, integration, e2e?)
  - What framework?
  - Any coverage requirements?
  - Where does the test code live?"

  User: "Unit and integration tests with JUnit 5, 80% coverage, in engine/src/test/"

  You: "I'll create feature `automated-testing` with:
  - Prompt: Set up JUnit 5 for unit and integration testing
  - Context: architecture pointing to engine module
  - Acceptance: Tests pass, 80% coverage, CI integration
  - Constraints: Use JUnit 5 + AssertJ, GWT pattern
  Sound good?"

  After confirmation, remind user to validate:
  ```bash
  ./gradlew clean build
  ```

  File location: `09_deployments/<deployment>/features/<id>.yml`
outputs:
  format: yaml
metadata:
  version: 3.0.0
  author: "AI Tools Team"
  created: "2025-11-16"
  updated: "2026-03-28"
  tags:
