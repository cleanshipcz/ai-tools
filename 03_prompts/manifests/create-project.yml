id: manifests-create-project
description: Clarify project context and create project.yml manifest aligned with the Kotlin engine
variables:
  - name: user_description
    required: true
    description: "Brief description of the project"
rulesets:
  - authoring-yaml
  - authoring-ai
  - authoring-manifests
fragments:
  - authoring-engine-models
rules:
  - "Ask clarifying questions BEFORE generating the manifest"
  - "Keep project manifests focused on essential context for AI agents"
  - "Do NOT try to document the entire codebase"
  - "All deployment settings live in the deploy: block of project.yml; there is no separate deploy.yml"
content: |
  The user wants to create a project manifest based on this description:

  {{user_description}}

  **Your job is to clarify and translate into a valid project manifest.**

  ## Step 1: Ask clarifying questions

  - What does this project do? (2-3 sentences)
  - Where is the project located? (path for deploy.directory)
  - Key documentation files? (README, architecture docs, etc.)
  - Any project-specific rules for AI agents?
  - Which agents/prompts/rulesets/fragments/skills should be available? (for filtering)
  - Should the project deploy for all tools configured in config.yml, or a narrower set?

  ## Step 2: Suggest structure

  - Propose a kebab-case ID
  - Identify key documentation references
  - Recommend a filter strategy per kind (tags, whitelist, or blacklist)

  ## Step 3: Create the project manifest

  Read ProjectManifest.kt and derive the exact field set from it (see the engine-models instructions).
  Study an existing project manifest (e.g., `09_deployments/ai-tools/project.yml`) as a style reference before writing.

  Illustrative skeleton (the Kotlin model is authoritative):

  ```yaml
  id: project-name
  description: What this project does (10-500 chars)

  context:
    overview: |
      Detailed project overview for AI agents to understand
      the project's purpose and architecture.
    documentation:
      readme: README.md
      per_topic:
        main_docs:
          architecture: docs/ARCHITECTURE.md
      additional:
        - path: CONTRIBUTING.md
          description: Contribution guidelines
    rules:
      - "Project-specific rules for AI agents"

  deploy:
    directory: "${PROJECTS_FOLDER}/my-project"   # or a relative path resolved against the working dir
    replace: false
    # tools: [claude, codex]                     # optional: narrow this project to a subset of the run's tools; omit for all
    agents:
      filter:
        - type: tags
          tags: [development, review]
    prompts:
      filter:
        - type: whitelist
          ids: [manifests-create-agent, refactor-improve-naming]
    rulesets:
      filter:
        - type: tags
          tags: [common, development]

  metadata:
    version: 1.0.0
    author: "AI Tools Team"
    created: "YYYY-MM-DD"
    tags: [project-domain, tech-stack]
  ```

  **Filters:** each kind (agents, prompts, rulesets, fragments, skills, features) takes a `filter:` LIST; each entry is `type: tags` + `tags: [...]`, `type: whitelist` + `ids: [...]`, or `type: blacklist` + `ids: [...]`. An omitted filter selects everything of that kind.

  ## Deployment

  Deployment is configured entirely in the `deploy:` block of `project.yml`: `directory`, optional `replace`, optional `tools`, and per-kind `filter` lists. There is no separate `deploy.yml`.
  The tools a run generates come from `tools:` in the root `config.yml`; a project may narrow them further with `deploy.tools` (omitting the key means all configured tools, an empty list means none).
  `deploy.directory` supports `${NAME}` references resolved from `env_vars` in the config files; relative paths resolve against the run's working directory.
  For user-scope deployments (artifacts landing under the user's home instead of a project), a deployment directory carries a `user.yml` instead — see UserDeploymentManifest.kt and `09_deployments/globals/user.yml`.

  ## Example conversation

  User: "TypeScript CLI tool for code generation"

  You: "Questions:
  - Where is the project located?
  - Key docs? (README, architecture?)
  - Any rules AI agents should follow?
  - Which agents should be available? (all, or specific ones?)"

  User: "At /home/user/projects/my-cli, has README.md, prefer TDD agents"

  You: "I'll create project.yml with:
  - id: my-cli
  - Overview explaining the CLI purpose
  - Documentation pointing to README.md
  - Deploy to /home/user/projects/my-cli
  - Agent filter: whitelist developer-feature, developer-bugfix, reviewer-code
  Sound good?"

  After confirmation, remind the user to validate as described in the engine-models instructions (./deploy.sh --dry-run from the repository root).
outputs:
  format: yaml
metadata:
  version: 3.1.1
  author: "AI Tools Team"
  created: "2025-11-16"
  updated: "2026-09-04"
  tags:
    - manifests
