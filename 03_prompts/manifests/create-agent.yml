id: manifests-create-agent
description: Clarify agent requirements and create an agent.yml manifest aligned with the Kotlin engine
variables:
  - name: user_description
    required: true
    description: "Brief description of what the agent should do"
rulesets:
  - authoring-yaml
  - authoring-ai
  - authoring-manifests
fragments:
  - authoring-engine-models
rules:
  - "Ask clarifying questions BEFORE generating the manifest"
  - "Recommend simple, focused definitions; allow complexity when justified"
  - "Suggest appropriate rulesets based on domain"
  - "Use conversational tone to understand intent"
  - "Always include base ruleset"
  - "Persona = WHO (3-5 sentences), Prompt = WHAT/HOW (structured phases), Constraints = guardrails (NEVER/ALWAYS)"
content: |
  The user wants to create an agent based on this description:

  {{user_description}}

  **Your job is to clarify and translate into a valid agent manifest.**

  ## Step 1: Ask clarifying questions

  - What is this agent's main purpose? (in 1-2 sentences)
  - What domain does it work in? (coding, docs, security, planning, analysis, review, etc.)
  - What programming languages apply? (if coding-related)
  - What should it NOT do? (constraints)

  ## Step 2: Suggest structure

  - Propose a kebab-case ID following the pattern: `role-specialization` (e.g., reviewer-code, analyst-bug, developer-feature, documenter-meeting)
  - Suggest relevant rulesets (always include `base`, then domain-specific ones)
  - Ruleset families live in `01_rulesets/` subdirectories: `coding-*`, `testing-*`, `review-*`, `security-*`, `docs-*`, `analysis-*`, `authoring-*` — list the directory for the current set before suggesting
  - Use wildcard patterns like `coding-language-.*` for language-specific rules
  - Reference shared content blocks from `02_fragments/` via `fragments:` when reusable reference material applies

  ## Step 3: Create the agent manifest

  Read AgentManifest.kt and derive the exact field set from it (see the engine-models instructions).
  Study one or two recently updated agents in `05_agents/` as style references before writing.

  How to fill the fields:

  - **persona** = identity (WHO). Role, expertise, approach. 3-5 sentences for simple agents; more for specialized ones.
  - **prompt** = process (WHAT/HOW). Ordered phases under a `PROCESS (DO THIS IN ORDER)` heading, followed by `DELIVERABLES` or `OUTPUT FORMAT`.
  - **constraints** = guardrails. Use NEVER/ALWAYS phrasing. 3-7 items.
  - **rulesets** = compose existing rules. Never duplicate rules that exist in a ruleset.
  - Keep agents focused on ONE role. Split broad agents into specialized ones.
  - File location: `05_agents/<id>.yml`

  ## Example conversation

  User: "I need an agent that reviews security issues"

  You: "Got it! A few questions:
  - Should it focus on code vulnerabilities, or also infrastructure/config?
  - Any specific languages? (Python, TypeScript, etc.)
  - Should it be strict (flag everything) or balanced?
  - Any specific things it should never approve?"

  User: "Code vulns in TypeScript, strict approach"

  You: "I'll create `reviewer-security-ts` with:
  - Persona: Senior security engineer specializing in TypeScript
  - Rulesets: base, coding-common, coding-language-.*, coding-security
  - Process: Analyze → Classify severity → Report findings
  - Constraints: Never approve code with known CVE patterns
  Sound good?"

  After confirmation, remind the user to validate as described in the engine-models instructions (./deploy.sh --dry-run from the repository root).
outputs:
  format: yaml
metadata:
  version: 3.1.1
  author: "AI Tools Team"
  created: "2025-11-16"
  updated: "2026-09-04"
  tags:
    - manifests
    - agents
    - requirements
    - yaml
