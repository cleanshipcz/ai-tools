id: manifests-create-skill
description: Clarify skill requirements and create a skill.yml manifest aligned with the Kotlin engine
variables:
  - name: user_description
    required: true
    description: "Brief description of the tool or workflow the skill should cover"
rulesets:
  - authoring-yaml
  - authoring-ai
  - authoring-manifests
fragments:
  - authoring-engine-models
rules:
  - "Ask clarifying questions BEFORE generating the manifest"
  - "Keep skill definitions simple and focused"
  - "One tool or workflow per skill"
  - "Compose shared content via ruleset and fragment sections instead of duplicating it"
content: |
  The user wants to create a skill based on this description:

  {{user_description}}

  **Your job is to clarify and translate into a valid skill manifest.**

  Skills are reusable instruction packages. The engine assembles each one from its sections, or takes it from a plain skill folder for a pointer skill, and deploys it as a SKILL.md the AI tool loads when the skill triggers.

  ## Step 1: Ask clarifying questions

  - What tool or workflow does this skill cover? (gradle, pytest, Confluence, Jira, etc.)
  - When should the AI use it? (this goes into the description, which doubles as the trigger)
  - What are the exact commands or steps, including where output lands?
  - Does it need supporting files? (templates, reference documents)
  - Does shared content already exist as a ruleset or fragment it should reference?
  - Does the skill already exist as a plain Claude Code skill folder (a `SKILL.md` with `name` and `description` frontmatter) that must stay usable outside ai-tools? Then the manifest only points at it with `source`.

  ## Step 2: Suggest structure

  For a pointer skill (the content stays in a plain skill folder), skip the rest of this step: the id is the `name` of the `SKILL.md` frontmatter, and the description and the body come from that folder, so ask for neither. Confirm instead that the folder lies outside every directory a deployment writes to, and exists on every machine that deploys.

  Otherwise:

  - Propose a kebab-case ID: verb-tool for command skills (run-pytest, search-repo), domain-tool for broader ones (confluence-doc, jira-ticket)
  - Write the description as "What it does. Use when ..." — the deployed description decides when the AI invokes the skill
  - Plan the ordered sections: inline text, referenced rulesets, referenced fragments

  ## Step 3: Create the skill manifest

  Read SkillManifest.kt and derive the exact field set from it (see the engine-models instructions).
  Study existing skills in `04_skills/` as style references: `run-detekt.yml` for a simple command skill, `docx-export/skill.yml` for one bundling a supporting file, and `jira-ticket/skill.yml` for a pointer to a plain skill folder. No existing skill composes ruleset or fragment sections, so write those from the syntax below.

  Key points from the model:

  - **sections** is an ordered list; each entry is exactly one of `text: |`, `ruleset: <ruleset-id>`, or `fragment: <fragment-id>`.
  - **files** bundles supporting files; each entry is `path: <p>` (same source and target) or `source: <s>` + `target: <t>`.
  - **source** (the skill-level key, not the `source` of a `files` entry) makes the manifest a pointer skill: it points at a plain skill folder instead. Its `SKILL.md` frontmatter `name` must equal the manifest `id`, its `description` becomes the skill description, the text after the frontmatter, from its first line that is not empty, is deployed unchanged, and every other file in the folder is copied along. Only `name` and `description` are read from the frontmatter; any other key, such as `allowed-tools`, is not deployed. A pointer skill declares only `id`, `source`, and `metadata` — never `description`, `sections`, or `files`. `source` may use `${NAME}` variables from `env_vars` or the environment, and a value that is `~` or starts with `~/` resolves against the home directory; any other relative path resolves against the folder holding the manifest. Every skill manifest is loaded on every run, so the folder must exist on every machine that deploys, and a missing or broken folder fails every run.
  - A skill is a single `04_skills/<id>.yml` when it has no files, `04_skills/<id>/skill.yml` with the files alongside when it bundles some, or, for a pointer skill, a `04_skills/<id>/skill.yml` holding only `id`, `source`, and `metadata`.

  ## Best practices

  - **One tool or workflow per skill.** Don't combine lint + test + build.
  - **Make the text sections operational:** exact commands, expected output locations, and how to summarize results.
  - **Reference rulesets and fragments** for content shared with other skills or prompts instead of copying it.
  - **Document prerequisites** in the text (tool installed, service running) so the AI can check before acting.

  ## Example conversation

  User: "Run pytest with coverage"

  You: "Questions:
  - Always with coverage, or optional?
  - Any specific pytest flags?
  - Where should reports go?"

  User: "Always with coverage, HTML report in .coverage/"

  You: "I'll create `run-pytest-coverage` with one text section:
  - Run pytest --cov --cov-report=html:.coverage/
  - Summarize totals: passed, failed, skipped
  - On failures, list failing test names and messages
  - Prerequisite: Python with pytest and pytest-cov installed
  Sound good?"

  After confirmation, remind the user to validate as described in the engine-models instructions (./deploy.sh --dry-run from the repository root).
outputs:
  format: yaml
