id: manifests-create-skill
description: Clarify tool/command requirements and create a skill.yml manifest
variables:
  - name: user_description
    required: true
    description: "Brief description of the tool or command to integrate"
rulesets:
  - authoring-yaml
  - authoring-ai
  - authoring-manifests
rules:
  - "Ask clarifying questions BEFORE generating the manifest"
  - "Keep skill definitions simple and focused"
  - "One command or tool per skill"
  - "Focus on WHAT the tool does, not HOW to implement it"
content: |
  The user wants to create a skill based on this description:

  {{user_description}}

  **Your job is to clarify and translate into a valid skill manifest.**

  **Note:** Skills do not currently have a Kotlin engine model — they are processed by
  the TypeScript CLI and transformed into SKILL.md files for Claude Code. The schema
  at `10_schemas/skill.schema.json` is the validation authority.

  ## Step 1: Ask clarifying questions

  - What command or tool does this integrate? (pytest, eslint, docker, gradle, etc.)
  - What does it do in one sentence?
  - What are the key parameters/flags?
  - Any environment requirements? (Python installed, Docker running, etc.)
  - Is this an MCP tool reference or a shell command?

  ## Step 2: Suggest structure

  - Propose a kebab-case ID following verb-tool pattern: `run-pytest`, `lint-typescript`, `search-repo`
  - Identify the command pattern
  - Note required tools/dependencies

  ## Step 3: Create skill.yml

  ```yaml
  id: verb-tool-name
  version: 1.0.0
  description: What this skill does in one sentence (10-500 chars)

  # Shell command execution
  command:
    program: 'tool-name'
    args: ['--flag', 'value']
    cwd: '.'
    env:                      # Optional env vars
      KEY: 'value'

  # OR MCP tool reference (mutually exclusive with command)
  # mcp_tool: 'server:tool-name'

  inputs:
    - name: parameter_name
      type: string            # string|number|boolean|file|directory
      required: true
      description: 'What this parameter controls'

  outputs:
    stdout: true
    stderr: true
    exit_code: true
    files:                    # Optional output files
      - 'report.json'

  constraints:
    - 'Tool X must be installed'

  timeout_sec: 300

  metadata:
    author: "AI Tools Team"
    created: "YYYY-MM-DD"
  ```

  ## Best practices

  - **One command per skill.** Don't combine lint + test + build.
  - **Define inputs/outputs** explicitly for composability in recipes.
  - **Set reasonable timeouts** (default 300s, increase for builds).
  - **Document constraints/prerequisites** so agents know what's needed.
  - **Use verb-noun ID pattern:** `run-*`, `lint-*`, `search-*`, `build-*`
  - File location: `02_skills/<id>.yml`

  ## Example

  User: "Run pytest with coverage"

  You: "Questions:
  - Should it always generate coverage or be optional?
  - Any specific pytest flags needed?
  - Where should reports go?"

  User: "Always with coverage, HTML report in .coverage/"

  You: "I'll create `run-pytest-coverage` with:
  - Command: pytest --cov --cov-report=html:.coverage/
  - Inputs: test path (optional)
  - Outputs: stdout, exit_code, .coverage/ files
  - Constraint: Python + pytest + pytest-cov installed
  Sound good?"
outputs:
  format: yaml
metadata:
  version: 3.0.0
  author: "AI Tools Team"
  created: "2025-11-16"
  updated: "2026-03-28"
  tags:
    - manifests
    - skills
    - tools
    - yaml
