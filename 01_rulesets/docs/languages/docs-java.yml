id: docs-language-java
description: JavaDoc conventions for documenting Java code — applies on top of docs-comments and docs-api-code
rules:
  - "Write doc comments as JavaDoc (/** ... */); the first sentence ends with a period and must stand alone as the summary, because JavaDoc extracts it for index pages."
  - "Reference types and members with {@link} and mark code literals with {@code}; use HTML only for paragraph breaks (<p>) and lists."
  - "In Java, on public API, give every parameter a @param tag and every non-void method a @return tag, because doclint reports missing ones; keep each tag to one phrase that states purpose or constraint, never the type."
  - "Use @throws for every exception the caller must handle, including unchecked ones such as IllegalArgumentException, and state the condition that triggers it."
  - "On an overriding method, inherit the parent documentation with {@inheritDoc} or omit the comment; never copy the parent text."
  - "Document record components with @param tags on the record declaration."
  - "State thread-safety and nullability in words or with annotations (for example @Nullable) wherever the caller cannot infer them from the signature."
  - "Mark @deprecated with the replacement as a {@link}, and add @since when the project tracks API versions."
  - "Document a package in package-info.java when the package is a public API boundary."
