id: docs-base
description: Core documentation principles and best practices applicable to all documentation types
rules:
  - "Write for the reader named in the task; adjust technical depth to that reader."
  - "Use consistent terminology throughout."
  - "One fact per sentence; split a sentence that carries more than one."
  - "Reference and link existing documentation instead of duplicating it."
  - "Match the project's existing documentation format and tone. To improve a convention, change it everywhere it applies rather than deviating in one place."
