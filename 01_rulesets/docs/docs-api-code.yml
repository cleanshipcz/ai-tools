id: docs-api-code
description: Coverage rules for documenting code-level APIs including functions, classes, methods, and modules — which elements and which aspects must be documented; always combine with docs-comments, which defines how a doc comment is written
rules:
  - "Document all public APIs, functions, classes, and methods."
  - "Document caller-visible edge cases and limitations as part of the contract."
  - "Describe each parameter's purpose and constraints, such as valid range, units, or what null or the default means; state the type only when the language does not declare it."
  - "Describe what the return value means and which values it can take; state the type only when the language does not declare it."
  - "List all thrown exceptions and when they occur."
  - "Document side effects and state changes."
  - "Document class invariants and contract conditions."
  - "Document configuration options and environment variables."
  - "Keep documentation accurate and up-to-date by verifying against actual implementation."
