id: confluence-format-guide
description: Guide for formatting Confluence pages
content: |
  Use headings (h1-h6) to structure content hierarchically.
  Use tables for structured data comparison.
  Use code blocks with language hints for code snippets.
  Use info/warning/note panels for callouts.
  Use expand macros for long reference sections.
  Use status macros for tracking (e.g., DONE, IN PROGRESS, TODO).
  Link to related pages instead of duplicating content.
  Use the table of contents macro for pages with more than three sections.
