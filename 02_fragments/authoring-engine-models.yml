id: authoring-engine-models
description: Source-of-truth instructions for generating manifests that match the Kotlin engine data models
content: |
  The Kotlin engine data models are the single source of truth for manifest structure.
  Before generating or editing a manifest, read the model file for its type in `ai-tools-engine/engine/src/main/kotlin/cz/cleanship/aitools/engine/models/` and derive the exact field set from it — never from memory or from schema snippets found elsewhere in the repository.

  Model file and manifest location by type:
  - Agent: AgentManifest.kt -> `05_agents/<id>.yml`; an optional `mcps` lists the ids of the MCP server manifests the agent uses, and every deployment that deploys the agent must select them; only Claude Code renders them (`mcpServers`)
  - Ruleset: RulesetManifest.kt -> `01_rulesets/<domain>/<id>.yml`
  - Prompt: PromptManifest.kt -> `03_prompts/<category>/<id>.yml`
  - Fragment: FragmentManifest.kt -> `02_fragments/<id>.yml`
  - Skill: SkillManifest.kt -> `04_skills/<id>.yml`; `04_skills/<id>/skill.yml` when the skill bundles supporting files; or, for a pointer skill, `04_skills/<id>/skill.yml` holding only `id`, `source`, and `metadata` when the skill is a plain `SKILL.md` folder kept elsewhere, which `source` points at (a relative `source` resolves against the folder holding the manifest)
  - MCP server: McpServerManifest.kt -> `07_mcp/<id>.yml`, either inline with `transport` (`type: stdio` or `type: http`) and `variables`, each variable declaring `secret: true|false`, or, for a pointer server, holding only `id`, `source` naming a `server.json` of the MCP Registry schema `2025-12-11` (or the folder holding it), an optional `select` (`package: <identifier>` or `remote: <url>`), an optional `pin` (`sha256:` followed by the 64 lowercase hexadecimal digits of the SHA-256 hash of the `server.json` bytes, as the warning of an unpinned pointer prints it), and `metadata`
  - Feature: FeatureManifest.kt -> `09_deployments/<deployment>/features/<id>.yml`
  - Project: ProjectManifest.kt -> `09_deployments/<deployment>/project.yml`; MCP servers are selected by an optional `deploy.mcps` block (`filter`, plus optional `tools: {<server id>: {allow: [...], deny: [...]}}`, where `allow` is applied by Codex only and a server id or tool name holding `__` fails the deployment), and a missing block selects none, unlike every other block
  - User deployment: UserDeploymentManifest.kt -> `09_deployments/<deployment>/user.yml`; MCP servers are selected by an optional top-level `mcps` block, of the same shape and rules as `deploy.mcps` of a project (see the Project line), and a missing block selects none
  - Recipe: no engine model; `08_recipes/<id>.yml`, structured per `08_recipes/GUIDE.md` and the existing recipes there

  How to read a model:
  - A constructor parameter with a default value is optional in YAML; every other parameter is required.
  - A field that is not in the model does not exist — never generate it, whatever older templates or examples suggest.
  - The version lives in `metadata.version` (semver); there is no top-level version field in engine-backed manifests.
  - A `@SerialName` annotation gives the YAML key when it differs from the property name (e.g. `acceptance_criteria`).
  - A sealed class (e.g. ProjectFilter) is a discriminated union: the YAML entry uses a `type:` key holding the subtype's `@SerialName` (e.g. `- type: tags`).

  Validation: run `./deploy.sh --dry-run` from the repository root. The engine parses every manifest, resolves every ruleset, fragment, and skill-file reference, reads the folder every pointer skill's `source` points at and the `server.json` every pointer MCP server's `source` points at, compares every pinned `server.json` with its `pin`, resolves the plain variables of every MCP server a deployment selects, checks every agent's `mcps` against the MCP server manifests and against the servers each deployment deploying it selects, checks that no path the run writes a skill to or deletes overlaps such a folder, and fails on any invalid one, without writing a file. `./deploy.sh` without `--dry-run` also deploys the generated artifacts into every configured project and the user's home, so leave that to the user. Building the engine with `./gradlew clean build` does NOT validate these manifests — it only builds and tests the engine code itself.
