id: authoring-engine-models
description: Source-of-truth instructions for generating manifests that match the Kotlin engine data models
content: |
  The Kotlin engine data models are the single source of truth for manifest structure.
  Before generating or editing a manifest, read the model file for its type in `ai-tools-engine/engine/src/main/kotlin/cz/cleanship/aitools/engine/models/` and derive the exact field set from it — never from memory or from schema snippets found elsewhere in the repository.

  Model file and manifest location by type:
  - Agent: AgentManifest.kt -> `05_agents/<id>.yml`; an optional `mcps` lists the ids of the MCP server manifests the agent uses, and every deployment that deploys the agent must select them; only Claude Code renders them (`mcpServers`)
  - Ruleset: RulesetManifest.kt -> `01_rulesets/<domain>/<id>.yml`
  - Prompt: PromptManifest.kt -> `03_prompts/<category>/<id>.yml`
  - Fragment: FragmentManifest.kt -> `02_fragments/<id>.yml`
  - Skill: SkillManifest.kt -> `04_skills/<id>.yml`; `04_skills/<id>/skill.yml` when the skill bundles supporting files; or, for a pointer skill, `04_skills/<id>/skill.yml` holding only `id`, `source`, and `metadata` when the skill is a plain `SKILL.md` folder kept elsewhere, which `source` points at (a relative `source` resolves against the folder holding the manifest)
  - MCP server: McpServerManifest.kt -> `07_mcp/<id>.yml`, either inline with `transport` (`type: stdio` or `type: http`) and `variables`, each variable (the model `McpVariable`) declaring `name`, `description`, `secret: true|false`, an optional `required` (default `true`), and, on a secret variable only, an optional `from: manager|environment` (default `manager`: on a machine whose `secrets_manager` in `config.yml` or `config.local.yml` is `libsecret`, the default, a stdio server with at least one such secret is started through the launcher `scripts/mcp-launch`, which reads it from the libsecret keyring with the environment of the tool as the fallback; `environment`: the environment of the tool only, and on a machine with `secrets_manager: environment` every secret is read that way; an http server always reads the environment; `from` on a plain variable fails loading), or, for a pointer server, holding only `id`, `source` naming a `server.json` of the MCP Registry schema `2025-12-11` (or the folder holding it), an optional `select` (`package: <identifier>` or `remote: <url>`), an optional `pin` (`sha256:` followed by the 64 lowercase hexadecimal digits of the SHA-256 hash of the `server.json` bytes, as the warning of an unpinned pointer prints it), and `metadata`
  - MCP server names: the launcher refuses the names of the block `mcp_launch_refused_names` of `scripts/mcp-launch`, compared without regard to case, each pattern of class A or class B. Class A: names that change how the launcher's shell or the programs it starts run, or that a shell sets or prints itself, such as `PATH`, `HOME`, `IFS`, `LANG`, `LC_*`, `BASH*`, `OPTIND`, `SHLVL`, `DBUS_*`, `XDG_*`, `LD_*`, `MALLOC_*`. Class B: every other refused name, such as `NODE_*`, `NPM_*` (so `NPM_TOKEN`), `PYTHON*`, `GIT_*` (so `GIT_TOKEN`), `DOCKER_*`, `SSL_*`, `*_PROXY`, `TMPDIR`. A server is started through the launcher when it is a stdio server with at least one keyring secret (no `from`, or `from: manager`). Such an inline server fails loading, on every machine whatever `secrets_manager` says, when a keyring secret has a name of either class, or when a secret with `from: environment`, a plain variable or a key under `env` has a class A name; a class B name loads in those three roles (as `HTTPS_PROXY` with `from: environment` in `07_mcp/atlassian.yml`). To fix a class A name, rename it, or declare every secret of the server `from: environment`. An inline server not started through the launcher is not checked. Such a server, and a pointer stdio server with a secret, also fails loading when its id does not start with a letter or digit or holds anything but letters, digits, `.`, `_` and `-`. A pointer server fails loading when its `server.json` sets, forwards or derives any name of either class.
  - Feature: FeatureManifest.kt -> `09_deployments/<deployment>/features/<id>.yml`
  - Project: ProjectManifest.kt -> `09_deployments/<deployment>/project.yml`; MCP servers are selected by an optional `deploy.mcps` block (`filter`, plus optional `tools: {<server id>: {allow: [...], deny: [...]}}`, where `allow` is applied by Codex only and a server id or tool name holding `__` fails the deployment), and a missing block selects none, unlike every other block
  - User deployment: UserDeploymentManifest.kt -> `09_deployments/<deployment>/user.yml`; MCP servers are selected by an optional top-level `mcps` block, of the same shape and rules as `deploy.mcps` of a project (see the Project line), and a missing block selects none
  - Recipe: no engine model; `08_recipes/<id>.yml`, structured per `08_recipes/GUIDE.md` and the existing recipes there

  How to read a model:
  - A constructor parameter with a default value is optional in YAML; every other parameter is required.
  - A field that is not in the model does not exist — never generate it, whatever older templates or examples suggest.
  - The version lives in `metadata.version` (semver); there is no top-level version field in engine-backed manifests.
  - A `@SerialName` annotation gives the YAML key when it differs from the property name (e.g. `acceptance_criteria`).
  - A sealed class (e.g. ProjectFilter) is a discriminated union: the YAML entry uses a `type:` key holding the subtype's `@SerialName` (e.g. `- type: tags`).

  Validation: run `./deploy.sh --dry-run` from the repository root. The engine parses every manifest, resolves every ruleset, fragment, and skill-file reference, reads the folder every pointer skill's `source` points at and the `server.json` every pointer MCP server's `source` points at, compares every pinned `server.json` with its `pin`, resolves the plain variables of every MCP server a deployment selects, reports where a tool will find each of its secrets without ever receiving a value, checks that `scripts/mcp-launch` exists, is executable, lies inside the checkout, is owned by the user running the engine and is writable by no one else, as is each directory from `scripts/` up to the root of the checkout, when a selected stdio server needs it, warns about every key of `config.yml` or `config.local.yml` it does not know, checks every agent's `mcps` against the MCP server manifests and against the servers each deployment deploying it selects, checks that no path the run writes a skill to or deletes overlaps such a folder, and fails on any invalid one, without writing a file. `./deploy.sh` without `--dry-run` also deploys the generated artifacts into every configured project and the user's home, so leave that to the user. Building the engine with `./gradlew clean build` does NOT validate these manifests — it only builds and tests the engine code itself.
